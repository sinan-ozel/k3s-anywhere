# Lets any pod on any consumer's chart opt into the GPU-node containerd
# runtime with `runtimeClassName: nvidia` — needed because containerd's
# `imports` config merge (a confirmed, longstanding, unfixed upstream bug:
# containerd/containerd#5837) makes it unreliable to set "nvidia" as the
# cluster-wide default runtime instead. See pulumi/<provider>/__main__.py's
# cloud_init_agent for the full story. NVIDIA's own docs recommend exactly
# this RuntimeClass as the fallback when the runtime can't be the node
# default: https://github.com/NVIDIA/k8s-device-plugin#configuring-containerd
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
